name: Scheduled OSM refresh

on:
  schedule:
    - cron: '0 3 * * 0'   # Weekly, Sunday 03:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Force download even if OSM extract is unchanged'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: scheduled-osm-refresh
  cancel-in-progress: false

jobs:
  refresh:
    timeout-minutes: 240
    # Full precompute requires PostGIS, osm2pgsql, the walkgraph binary,
    # and ~1 GB disk for the OSM extract. Configure a self-hosted runner
    # with these prerequisites and register it in your repository settings.
    # No dedicated runner label is documented in the repo yet, so keep the
    # generic self-hosted label here until one is explicitly added.
    runs-on: self-hosted

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Download latest OSM extract
        # Keep the force flag expansion shell-neutral so this workflow remains
        # portable across self-hosted runner OSes.
        run: python scripts/refresh_osm.py${{ github.event.inputs.force == 'true' && ' --force' || '' }}

      - name: Run precompute
        run: |
          python main.py transit
          python main.py precompute --auto-refresh-import

      - name: Run sanity fixture
        run: python scripts/sanity_check.py --profile full
