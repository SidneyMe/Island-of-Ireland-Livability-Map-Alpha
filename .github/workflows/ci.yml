name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build

      - name: Verify checked-in frontend bundle is up to date
        run: |
          git ls-files --error-unmatch static/dist/app.css static/dist/app.js
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Frontend bundle files must be tracked: static/dist/app.css and static/dist/app.js."
            exit 1
          }
          $status = git status --porcelain -- static/dist
          if ($status) {
            $status
            Write-Error "Frontend build changed static/dist or created untracked bundle files. Rebuild with 'npm run build' in frontend and commit the updated static/dist artifact."
            exit 1
          }

      - name: Run Python tests
        run: python -m unittest discover -s tests -t . -p "test_*.py"

      - name: Run Rust tests
        run: cargo test --manifest-path walkgraph/Cargo.toml

      - name: Validate sanity fixture structure
        run: python scripts/sanity_check.py --validate-only
